standalone_category_ids:
  type: list
  list_type: category
  default: "8|9"
  description: "做成「独立页面」的分类（默认二手市场 8、评分中心 9，子分类也算）：侧边栏「类别」和「全部 ▾」下拉里不显示，改成侧边栏「话题」下面的入口；进去以后顶部只显示「‹ 首页」和标题"
quick_category_ids:
  type: list
  list_type: category
  default: "8|9"
  description: "帖子列表上方「全部」下拉框右边的快捷分类按钮（默认：二手市场 8、评分中心 9）。按这里的顺序显示"
bottom_bar_home_label:
  default: "首页"
  description: "手机底栏最左边（全部话题）的文字"
bottom_bar_home_icon:
  default: "house"
  description: "手机底栏最左边的图标"
bottom_bar_left_label:
  default: "二手"
  description: "手机底栏左边分类按钮的文字"
bottom_bar_right_label:
  default: "评分"
  description: "手机底栏右边分类按钮的文字"
bottom_bar_me_label:
  default: "我的"
  description: "手机底栏最右边（我的个人主页）的文字"
bottom_bar_me_icon:
  default: "user"
  description: "手机底栏最右边的图标"
bottom_bar_left_category:
  type: integer
  default: 8
  description: "手机底栏左边的分类 ID（默认 8 = 二手市场）"
bottom_bar_left_icon:
  default: "cart-shopping"
  description: "手机底栏左边的图标（Font Awesome 名称）"
bottom_bar_right_category:
  type: integer
  default: 9
  description: "手机底栏右边的分类 ID（默认 9 = 评分中心）"
bottom_bar_right_icon:
  default: "ranking-star"
  description: "手机底栏右边的图标（Font Awesome 名称）"
bottom_bar_center_icon:
  default: "plus"
  description: "手机底栏中间发帖按钮的图标"
category_tabs_hidden_ids:
  type: list
  list_type: category
  default: "3|8|9"
  description: "手机顶部分类标签里不显示的分类（默认 3 = 管理人员、8 = 二手市场、9 = 评分中心；二手、评分在底栏里有）。子分类和未分类本来就不显示"
waterfall_excluded_category_ids:
  type: list
  list_type: category
  default: "8|9"
  description: "手机上不用瀑布流、保留插件卡片的分类（默认二手市场 8、评分中心 9；它们的子分类也一样）"
text_cover_image:
  type: upload
  default: ""
  description: "瀑布流里没有图片的帖子用的「文字封面」背景图（建议 3:4 竖图）。不传时用品牌色纯色背景"
text_cover_text_color:
  default: "#0A2D56"
  description: "文字封面上标题的颜色（用了上面的背景图时生效）"
post_share_icon:
  default: "arrow-up-from-bracket"
  description: "帖子菜单里分享按钮的图标（Font Awesome 名称）。点开是「复制链接」「保存分享图」"
post_reply_icon:
  default: "far-comment"
  description: "帖子菜单里回复按钮的图标（Font Awesome 名称）"
share_image_site_url:
  default: "https://kyotooo.com"
  description: "分享图二维码里的网址开头（二维码指向 网址/t/帖子ID）。留空时用当前访问的网址"
share_image_brand:
  default: "京圈 · 京大社区"
  description: "分享图底部 Logo 右边的大字"
share_image_hint:
  default: "长按识别二维码，查看完整内容"
  description: "分享图底部大字下面的提示"
